const isLight = (hex) => {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return (r*299+g*587+b*114)/1000 > 155;
};

const Swatch = ({name, token, hex, usage}) => {
  const [copied, setCopied] = useState(false);
  const doCopy = () => { try{navigator.clipboard.writeText(hex);}catch(e){} setCopied(true); setTimeout(()=>setCopied(false),1400); };
  const light = isLight(hex);
  return (
    <div onClick={doCopy} style={{borderRadius:10, overflow:'hidden', border:'1px solid #E8E5DD', cursor:'pointer', transition:'transform 0.12s', userSelect:'none'}}
      onMouseEnter={e=>e.currentTarget.style.transform='translateY(-2px)'}
      onMouseLeave={e=>e.currentTarget.style.transform='none'}>
      <div style={{height:60, background:hex, display:'flex', alignItems:'flex-end', padding:'6px 8px'}}>
        <span style={{fontSize:10, fontFamily:"'JetBrains Mono',monospace", color:light?'rgba(0,0,0,0.45)':'rgba(255,255,255,0.75)', fontWeight:500}}>
          {copied ? '✓ copié' : hex}
        </span>
      </div>
      <div style={{padding:'9px 10px', background:'#fff'}}>
        <div style={{fontSize:12, fontWeight:600, marginBottom:2, color:'#2A2A2A'}}>{name}</div>
        <div style={{fontSize:10, fontFamily:"'JetBrains Mono',monospace", color:'#5D7B3E', marginBottom:5}}>{token}</div>
        <div style={{fontSize:10, color:'#999', lineHeight:1.35}}>{usage}</div>
      </div>
    </div>
  );
};

const Tag = ({children, mono=false, green=false, style={}}) => (
  <span style={{display:'inline-flex', alignItems:'center', padding:'2px 8px', borderRadius:6, fontSize:11, fontWeight:500,
    fontFamily: mono?"'JetBrains Mono',monospace":'inherit',
    background:green?'#E8F2E0':'#EDEAE3', color:green?'#3D6A25':'#555', whiteSpace:'nowrap', ...style}}>
    {children}
  </span>
);

const CodeBlock = ({code, label}) => {
  const [copied, setCopied] = useState(false);
  const doCopy = () => { try{navigator.clipboard.writeText(code);}catch(e){} setCopied(true); setTimeout(()=>setCopied(false),1800); };
  return (
    <div style={{borderRadius:10, overflow:'hidden', marginTop:12}}>
      <div style={{padding:'7px 16px', background:'#1A2818', display:'flex', justifyContent:'space-between', alignItems:'center', borderBottom:'1px solid #2C4020'}}>
        <span style={{fontSize:11, color:'#7BB865', fontFamily:"'JetBrains Mono',monospace", fontWeight:500}}>{label}</span>
        <button onClick={doCopy} style={{background:'none', border:'none', cursor:'pointer', fontSize:11, color:copied?'#7BB865':'#5A7A50', fontFamily:"'JetBrains Mono',monospace", padding:0}}>
          {copied ? '✓ copié' : 'copier'}
        </button>
      </div>
      <pre style={{background:'#1A2818', color:'#B8D4A0', padding:'18px 20px', fontSize:12, fontFamily:"'JetBrains Mono',monospace", overflowX:'auto', lineHeight:1.65, margin:0}}>{code}</pre>
    </div>
  );
};

const Btn = ({children, variant='primary', size='md', style={}}) => {
  const h = size==='sm'?28:size==='lg'?42:36;
  const bg = variant==='primary'?'#5D7B3E':variant==='danger'?'#C0392B':variant==='ghost'?'transparent':'#EDEAE3';
  const c  = variant==='primary'||variant==='danger'?'#fff':'#2A2A2A';
  const border = variant==='ghost'?'1.5px solid #E0DDD5':'none';
  return (
    <div style={{height:h, padding:'0 16px', borderRadius:10, background:bg, color:c, display:'inline-flex', alignItems:'center', justifyContent:'center', fontSize:size==='sm'?12:13, fontWeight:600, border, cursor:'pointer', userSelect:'none', ...style}}>
      {children}
    </div>
  );
};

const TabBarDemo = () => {
  const [active, setActive] = useState('commandes');
  const tabs = [
    {k:'dashboard', ic:'⊞', l:'Accueil'},
    {k:'commandes', ic:'◧', l:'Commandes', badge:3},
    {k:'pointage',  ic:'◷', l:'Pointage'},
    {k:'stock',     ic:'◫', l:'Stock'},
    {k:'plus',      ic:'☰', l:'Plus'},
  ];
  return (
    <div style={{background:'#F5F5F0', borderRadius:12, padding:'12px 12px 0', border:'1px solid #EEEAE2', overflow:'hidden'}}>
      <div style={{background:'rgba(255,255,255,0.97)', borderTop:'1px solid #E0DDD5', display:'grid', gridTemplateColumns:'repeat(5,1fr)', padding:'6px 0 20px', borderRadius:'0 0 10px 10px'}}>
        {tabs.map(t=>(
          <div key={t.k} onClick={()=>setActive(t.k)} style={{display:'flex', flexDirection:'column', alignItems:'center', gap:3, padding:'4px 0', cursor:'pointer', position:'relative'}}>
            <div style={{position:'relative'}}>
              <span style={{fontSize:22, opacity:t.k===active?1:0.38, color:t.k===active?'#5D7B3E':'#2A2A2A'}}>{t.ic}</span>
              {t.badge&&t.k!==active&&<div style={{position:'absolute', top:-2, right:-7, background:'#E04040', color:'#fff', borderRadius:8, fontSize:9, fontWeight:700, padding:'1px 4px', minWidth:14, textAlign:'center', border:'1.5px solid #fff'}}>{t.badge}</div>}
            </div>
            <span style={{fontSize:10, color:t.k===active?'#5D7B3E':'#777', fontWeight:t.k===active?600:400}}>{t.l}</span>
          </div>
        ))}
      </div>
    </div>
  );
};

const NAV = [

/* ─── Main App ───────────────────────────────────────────────────────────── */
const App = () => {
  const [activeNav, setActiveNav] = useState('marque');

  useEffect(() => {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if(e.isIntersecting) setActiveNav(e.target.id); });
    }, { rootMargin:'-20% 0px -70% 0px' });
    NAV.forEach(n => { const el = document.getElementById(n.id); if(el) obs.observe(el); });
    return () => obs.disconnect();
  }, []);

  const compDemos = {
    btn:    <ButtonDemo />,
    badge:  <BadgeDemo />,
    card:   <CardDemo />,
    input:  <InputDemo />,
    header: <HeaderDemo />,
    tabbar: <TabBarDemo />,
  };

  return (
    <div style={{display:'flex', minHeight:'100vh', fontFamily:"'Outfit',sans-serif"}}>

      {/* ── Sidebar ── */}
      <aside style={{width:216, background:'#2C4A2E', position:'fixed', top:0, left:0, bottom:0, display:'flex', flexDirection:'column', zIndex:100, overflowY:'auto'}}>
        {/* Brand */}
        <div style={{padding:'24px 20px 20px'}}>
          <img src="uploads/logo sans Ice Tea.png" alt="ThéCol" style={{width:100, height:'auto', borderRadius:10, display:'block', marginBottom:10}} />
          <div style={{color:'rgba(255,255,255,0.4)', fontSize:10}}>Design System v1.0</div>
        </div>
        {/* Nav */}
        <nav style={{flex:1, padding:'0 10px'}}>
          {NAV.map(n=>(
            <a key={n.id} href={'#'+n.id} onClick={()=>setActiveNav(n.id)} style={{
              display:'block', padding:'9px 12px', borderRadius:8, marginBottom:2, textDecoration:'none',
              color: activeNav===n.id?'#B8D4A0':'rgba(255,255,255,0.55)',
              background: activeNav===n.id?'rgba(93,123,62,0.4)':'transparent',
              fontSize:13, fontWeight: activeNav===n.id?600:400,
              transition:'all 0.15s',
            }}>{n.label}</a>
          ))}
        </nav>
        {/* Footer */}
        <div style={{padding:'16px 20px', borderTop:'1px solid rgba(255,255,255,0.08)', color:'rgba(255,255,255,0.3)', fontSize:11, lineHeight:1.5}}>
          Kotlin / Java<br/>Mai 2026
        </div>
      </aside>

      {/* ── Content ── */}
      <main style={{marginLeft:216, flex:1, padding:'52px 56px 80px', maxWidth:'calc(100vw - 216px)'}}>

        {/* Page header */}
        <div style={{marginBottom:52}}>
          <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:10}}>
            <Tag green style={{fontSize:10}}>v1.0</Tag>
            <Tag style={{fontSize:10}}>Android</Tag>
            <Tag style={{fontSize:10}}>Material 3</Tag>
          </div>
          <h1 style={{fontSize:40, fontWeight:700, color:'#2A2A2A', lineHeight:1, marginBottom:10}}>Design System</h1>
          <p style={{fontSize:14, color:'#888', maxWidth:540, lineHeight:1.7}}>
            Tokens, composants et spec d'interactions pour l'app ThéCol — Android Kotlin/Java avec Material 3.
            Cliquez sur une couleur ou un bloc de code pour copier la valeur.
          </p>
          <div style={{display:'flex', gap:12, marginTop:16}}>
            <div style={{padding:'10px 16px', background:'#fff', borderRadius:10, border:'1px solid #EEEAE2', textAlign:'center'}}>
              <div style={{fontSize:20, fontWeight:700, color:'#5D7B3E'}}>{COLOR_GROUPS.reduce((s,g)=>s+g.tokens.length,0)}</div>
              <div style={{fontSize:11, color:'#999', marginTop:2}}>couleurs</div>
            </div>
            <div style={{padding:'10px 16px', background:'#fff', borderRadius:10, border:'1px solid #EEEAE2', textAlign:'center'}}>
              <div style={{fontSize:20, fontWeight:700, color:'#5D7B3E'}}>{TYPE_SCALE.length}</div>
              <div style={{fontSize:11, color:'#999', marginTop:2}}>styles typo</div>
            </div>
            <div style={{padding:'10px 16px', background:'#fff', borderRadius:10, border:'1px solid #EEEAE2', textAlign:'center'}}>
              <div style={{fontSize:20, fontWeight:700, color:'#5D7B3E'}}>{COMPONENTS.length}</div>
              <div style={{fontSize:11, color:'#999', marginTop:2}}>composants</div>
            </div>
            <div style={{padding:'10px 16px', background:'#fff', borderRadius:10, border:'1px solid #EEEAE2', textAlign:'center'}}>
              <div style={{fontSize:20, fontWeight:700, color:'#5D7B3E'}}>3</div>
              <div style={{fontSize:11, color:'#999', marginTop:2}}>fichiers XML</div>
            </div>
          </div>
        </div>

        {/* ════ MARQUE ════ */}
        <section id="marque" style={{marginBottom:72}}>
          <SectionHdr title="Marque & Logo" sub="Identité visuelle ThéCol — utiliser ces fichiers source pour toutes les intégrations." />

          {/* Logo showcase */}
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:16, marginBottom:28}}>
            {/* Sur fond clair */}
            <div style={{background:'#fff', borderRadius:12, border:'1px solid #EEEAE2', padding:'28px 20px', display:'flex', flexDirection:'column', alignItems:'center', gap:12}}>
              <img src="uploads/logo sans Ice Tea.png" alt="ThéCol logo" style={{width:120, height:'auto'}} />
              <div style={{fontSize:11, fontWeight:600, color:'#888', textTransform:'uppercase', letterSpacing:0.5}}>Fond blanc</div>
              <Tag style={{fontSize:10}}>Usage principal</Tag>
            </div>
            {/* Sur fond brand */}
            <div style={{background:'#2C4A2E', borderRadius:12, padding:'28px 20px', display:'flex', flexDirection:'column', alignItems:'center', gap:12}}>
              <img src="uploads/logo sans Ice Tea.png" alt="ThéCol logo" style={{width:120, height:'auto', borderRadius:8}} />
              <div style={{fontSize:11, fontWeight:600, color:'rgba(255,255,255,0.5)', textTransform:'uppercase', letterSpacing:0.5}}>Fond sombre</div>
              <Tag green style={{fontSize:10}}>Header app</Tag>
            </div>
            {/* Sur fond app */}
            <div style={{background:'#F5F5F0', borderRadius:12, border:'1px solid #EEEAE2', padding:'28px 20px', display:'flex', flexDirection:'column', alignItems:'center', gap:12}}>
              <img src="uploads/logo sans Ice Tea.png" alt="ThéCol logo" style={{width:120, height:'auto'}} />
              <div style={{fontSize:11, fontWeight:600, color:'#888', textTransform:'uppercase', letterSpacing:0.5}}>Fond app</div>
              <Tag style={{fontSize:10}}>Splash screen</Tag>
            </div>
          </div>

          {/* Logo specs */}
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginBottom:24}}>
            <div style={{background:'#fff', borderRadius:12, border:'1px solid #EEEAE2', padding:'18px'}}>
              <div style={{fontSize:13, fontWeight:600, marginBottom:12}}>Spécifications</div>
              <SpecRow label="Format source" value="PNG 1280×1280px" />
              <SpecRow label="Logo app icon" value="logo mail.jpg (77×77px)" />
              <SpecRow label="Taille min. écran" value="80dp de large" />
              <SpecRow label="Taille launcher icon" value="48 / 72 / 96 / 144 / 192dp" />
              <SpecRow label="Espace de protection" value="≥ 16dp autour du logo" />
              <SpecRow label="Fond logo" value="#C8F0C0 (mint — ne pas modifier)" />
            </div>
            <div style={{background:'#fff', borderRadius:12, border:'1px solid #EEEAE2', padding:'18px'}}>
              <div style={{fontSize:13, fontWeight:600, marginBottom:12}}>Couleurs du logo</div>
              <div style={{display:'flex', gap:10, marginBottom:12}}>
                {[
                  {name:'Vert texte',  hex:'#3CB043', note:'Wordmark principal'},
                  {name:'Vert montagne', hex:'#2D7A35', note:'Illustration'},
                  {name:'Fond mint',   hex:'#C8F0C0', note:'Background logo'},
                ].map(c=>(
                  <div key={c.hex} style={{flex:1, textAlign:'center'}}>
                    <div style={{height:40, background:c.hex, borderRadius:8, marginBottom:6, border:'1px solid #E8E5DD'}}/>
                    <div style={{fontSize:10, fontFamily:"'JetBrains Mono',monospace", color:'#5D7B3E', marginBottom:2}}>{c.hex}</div>
                    <div style={{fontSize:9, color:'#999'}}>{c.note}</div>
                  </div>
                ))}
              </div>
              <div style={{padding:'10px 12px', background:'#FFF8E8', borderRadius:8, fontSize:11, color:'#C8960A', lineHeight:1.5}}>
                ⚠ Les couleurs du logo (vert vif) diffèrent du vert UI (#5D7B3E). Ne pas les mélanger.
              </div>
            </div>
          </div>

          {/* À ne pas faire */}
          <div style={{background:'#fff', borderRadius:12, border:'1px solid #EEEAE2', padding:'18px'}}>
            <div style={{fontSize:13, fontWeight:600, marginBottom:12}}>À ne pas faire</div>
            <div style={{display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12}}>
              {[
                {rule:'Ne pas recadrer la montagne', icon:'✗'},
                {rule:'Ne pas changer les couleurs', icon:'✗'},
                {rule:'Ne pas ajouter d\'ombre portée', icon:'✗'},
                {rule:'Ne pas étirer le logo', icon:'✗'},
              ].map(r=>(
                <div key={r.rule} style={{textAlign:'center', padding:'12px 8px', background:'#FFF5F5', borderRadius:8, border:'1px solid #F0E0E0'}}>
                  <div style={{fontSize:18, color:'#C0392B', marginBottom:6}}>{r.icon}</div>
                  <div style={{fontSize:11, color:'#888', lineHeight:1.4}}>{r.rule}</div>
                </div>
              ))}
            </div>
          </div>
        </section>

        {/* ════ COULEURS ════ */}
        <section id="couleurs" style={{marginBottom:72}}>
          <SectionHdr title="Couleurs" sub="Tous les tokens — déclarer dans res/values/colors.xml. Cliquer sur une swatch pour copier le hex." />
          {COLOR_GROUPS.map(g=>(
            <div key={g.label} style={{marginBottom:32}}>
              <div style={{fontSize:11, fontWeight:600, color:'#888', textTransform:'uppercase', letterSpacing:0.6, marginBottom:12}}>{g.label}</div>

            La section <strong>Section Label</strong> est toujours <strong>UPPERCASE + letterSpacing 0.04</strong>.

                <div key={s} style={{display:'flex', flexDirection:'column', alignItems:'center', gap:8}}>
                  <div style={{width:s, height:s, background:'linear-gradient(135deg,#5D7B3E,#8BA66B)', borderRadius:3, flexShrink:0}}/>
                  <Tag mono style={{fontSize:10}}>{s}dp</Tag>
                </div>
              ))}
            </div>
          </div>

          {/* Radii */}
          <div style={{marginBottom:32}}>
            <div style={{fontSize:11, fontWeight:600, color:'#888', textTransform:'uppercase', letterSpacing:0.6, marginBottom:12}}>Border Radius</div>
            <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(120px,1fr))', gap:12}}>
              {RADII.map(r=>(
                <div key={r.name} style={{background:'#fff', borderRadius:10, border:'1px solid #EEEAE2', padding:'16px', textAlign:'center'}}>
                  <div style={{width:52, height:52, background:'linear-gradient(135deg,#5D7B3E22,#5D7B3E55)', border:'2px solid #5D7B3E', borderRadius:Math.min(r.dp,26), margin:'0 auto 12px'}}/>
                  <Tag mono style={{fontSize:10}}>{r.dp}dp</Tag>
                  <div style={{fontSize:10, fontFamily:"'JetBrains Mono',monospace", color:'#5D7B3E', marginTop:6}}>{r.name}</div>
                  <div style={{fontSize:10, color:'#999', marginTop:4, lineHeight:1.3}}>{r.usage}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Elevation */}
          <div>
            <div style={{fontSize:11, fontWeight:600, color:'#888', textTransform:'uppercase', letterSpacing:0.6, marginBottom:12}}>Élévation</div>
            <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12}}>
              {[
                {name:'Card',   elev:'1dp', shade:'0 1px 3px rgba(0,0,0,0.05)', usage:'MaterialCardView standard'},
                {name:'Header', elev:'0 + divider', shade:'borderBottom 1dp colorBorder', usage:'AppBar, Tab Bar'},
                {name:'Dialog', elev:'4dp', shade:'0 8px 24px rgba(0,0,0,0.12)', usage:'Bottom Sheet, Dialogs'},
              ].map(e=>(
                <div key={e.name} style={{background:'#fff', borderRadius:12, padding:'18px', boxShadow:e.name==='Dialog'?'0 8px 24px rgba(0,0,0,0.12)':e.name==='Card'?'0 1px 3px rgba(0,0,0,0.05)':'none', border:e.name==='Header'?'1px solid #E0DDD5':'none'}}>
                  <div style={{fontWeight:600, fontSize:14, marginBottom:6}}>{e.name}</div>
                  <Tag mono style={{fontSize:11}}>{e.elev}</Tag>
                  <div style={{fontSize:11, color:'#999', marginTop:8, lineHeight:1.4}}>{e.usage}</div>
                </div>
              ))}
            </div>
          </div>
        </section>

        {/* ════ COMPOSANTS ════ */}
        <section id="composants" style={{marginBottom:72}}>
          <SectionHdr title="Composants" sub="Démonstrations interactives + spécifications complètes pour l'implémentation Android." />

          {COMPONENTS.map(c=>(
            <div key={c.id} style={{marginBottom:40}}>
              <div style={{fontSize:16, fontWeight:600, color:'#2A2A2A', marginBottom:12}}>{c.label}</div>
              <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, alignItems:'start'}}>
                <div>{compDemos[c.id]}</div>
                <div style={{background:'#fff', borderRadius:12, border:'1px solid #EEEAE2', padding:'14px 18px'}}>
                  {c.specs.map(([l,v])=><SpecRow key={l} label={l} value={v}/>)}
                </div>
              </div>
            </div>
          ))}

          {/* Step tracker */}
          <div style={{marginBottom:40}}>
            <div style={{fontSize:16, fontWeight:600, color:'#2A2A2A', marginBottom:12}}>Tracker progression</div>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, alignItems:'start'}}>
              <StepTrackerDemo/>
              <div style={{background:'#fff', borderRadius:12, border:'1px solid #EEEAE2', padding:'14px 18px'}}>
                <SpecRow label="États" value="done · current · pending"/>
                <SpecRow label="Pastille done" value="24dp, bg colorSuccess, ✓ blanc"/>
                <SpecRow label="Pastille current" value="24dp, bg colorWarningBg, border colorPrimary"/>
                <SpecRow label="Pastille pending" value="24dp, bg #EDEAE3"/>
                <SpecRow label="Connecteur" value="flex:1, h 2dp, colorSuccess si done"/>
                <SpecRow label="Label actif" value="9sp, w600, colorPrimary"/>
              </div>
            </div>
          </div>

          {/* Avatars */}
          <div style={{marginBottom:40}}>
            <div style={{fontSize:16, fontWeight:600, color:'#2A2A2A', marginBottom:12}}>Avatars employés</div>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, alignItems:'start'}}>
              <AvatarDemo/>
              <div style={{background:'#fff', borderRadius:12, border:'1px solid #EEEAE2', padding:'14px 18px'}}>
                <SpecRow label="Fond" value="colorSuccessBg (#B8D4A0)"/>
                <SpecRow label="Initiales" value="fontSize = size × 0.3, w700"/>
                <SpecRow label="Dot live" value="size × 0.26, bg #3CA350, border 2dp blanc"/>
                <SpecRow label="Tailles" value="30dp (sm) · 36dp (md) · 46dp (lg)"/>
              </div>
            </div>
          </div>
        </section>

        {/* ════ INTERACTIONS ════ */}
        <section id="interactions" style={{marginBottom:72}}>
          <SectionHdr title="Interactions & Navigation" sub="Spec des animations, transitions et comportements tactiles de l'app." />
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16}}>
            {SPEC_INTERACTIONS.map(s=>(
              <div key={s.title} style={{background:'#fff', borderRadius:12, border:'1px solid #EEEAE2', overflow:'hidden'}}>
                <div style={{padding:'14px 18px', borderBottom:'1px solid #F0EDE6', display:'flex', alignItems:'center', gap:10}}>
                  <div style={{width:32, height:32, borderRadius:8, background:s.color+'18', display:'flex', alignItems:'center', justifyContent:'center', fontSize:16}}>{s.icon}</div>
                  <div style={{fontSize:14, fontWeight:600}}>{s.title}</div>
                </div>
                <div style={{padding:'6px 18px 14px'}}>
                  {s.items.map(({label,value})=><SpecRow key={label} label={label} value={value}/>)}
                </div>
              </div>
            ))}
          </div>

          {/* Navigation flow */}
          <div style={{marginTop:24, background:'#fff', borderRadius:12, border:'1px solid #EEEAE2', overflow:'hidden'}}>
            <div style={{padding:'14px 20px', borderBottom:'1px solid #F0EDE6', fontSize:14, fontWeight:600}}>Flux de navigation</div>
            <div style={{padding:'20px', overflowX:'auto'}}>
              <div style={{display:'flex', gap:0, alignItems:'center', minWidth:680}}>
                {[
                  {screen:'Dashboard',   note:'Accueil', color:'#5D7B3E'},
                  {screen:'Commandes',   note:'Liste + calendrier', color:'#2E72B8'},
                  {screen:'Détail cmd', note:'Slide-in', color:'#2E72B8'},
                  {screen:'+ Commande', note:'Sheet modal', color:'#C8960A'},
                ].map((n,i,arr)=>(
                  <React.Fragment key={n.screen}>
                    <div style={{textAlign:'center', minWidth:100}}>
                      <div style={{width:72, height:72, borderRadius:12, background:n.color+'18', border:`2px solid ${n.color}`, display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 8px', fontSize:11, fontWeight:600, color:n.color, padding:4, textAlign:'center', lineHeight:1.3}}>{n.screen}</div>
                      <div style={{fontSize:10, color:'#999'}}>{n.note}</div>
                    </div>
                    {i<arr.length-1&&<div style={{flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:2, margin:'0 4px', marginBottom:18}}>
                      <div style={{height:2, background:'#E0DDD5', width:'100%'}}/>
                      <div style={{fontSize:9, color:'#AAA'}}>slide-in</div>
                    </div>}
                  </React.Fragment>
                ))}
              </div>
              <div style={{display:'flex', gap:0, alignItems:'center', minWidth:680, marginTop:24}}>
                {[
                  {screen:'Pointage', note:'Accueil', color:'#C8960A'},
                  {screen:'Stock',    note:'Accueil', color:'#7BB865'},
                  {screen:'Inventaire',note:'Sous-module', color:'#7BB865'},
                  {screen:'Production',note:'Sous-module', color:'#7BB865'},
                ].map((n,i,arr)=>(
                  <React.Fragment key={n.screen}>
                    <div style={{textAlign:'center', minWidth:100}}>
                      <div style={{width:72, height:72, borderRadius:12, background:n.color+'18', border:`2px solid ${n.color}`, display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 8px', fontSize:11, fontWeight:600, color:n.color, padding:4, textAlign:'center', lineHeight:1.3}}>{n.screen}</div>
                      <div style={{fontSize:10, color:'#999'}}>{n.note}</div>
                    </div>
                    {i<arr.length-1&&<div style={{flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:2, margin:'0 4px', marginBottom:18}}>
                      <div style={{height:2, background:'#E0DDD5', width:'100%'}}/>
                      <div style={{fontSize:9, color:'#AAA'}}>{i===0?'tab':'nav'}</div>
                    </div>}
                  </React.Fragment>
                ))}
              </div>
            </div>
          </div>
        </section>

        {/* ════ ANDROID XML ════ */}
        <section id="android-xml" style={{marginBottom:72}}>
          <SectionHdr title="Android XML" sub="Fichiers prêts à copier dans votre projet. Cliquer sur 'copier' pour récupérer le contenu complet." />
          <CodeBlock code={XML_COLORS} label="res/values/colors.xml" />
          <CodeBlock code={XML_DIMENS} label="res/values/dimens.xml" />
          <CodeBlock code={XML_THEMES} label="res/values/themes.xml" />

          {/* Notes */}
          <div style={{marginTop:20, background:'#E8F2E0', borderRadius:12, padding:'20px 24px', fontSize:13, color:'#3D6A25', lineHeight:1.75}}>
            <div style={{fontSize:14, fontWeight:700, marginBottom:10}}>Notes d'implémentation</div>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
              {[
                ['Font Google', 'Télécharger Outfit via Downloadable Fonts dans Android Studio (File > New > More > Download Fonts)'],
                ['Material 3', "Dépendance : com.google.android.material:material:1.11.0+"],
                ['Navigation', 'Jetpack Navigation Component pour les transitions slide (navOptions{})'],
                ['Bottom Nav', 'NavigationBar (Material 3) + NavigationBarItem — NavigationUI.setupWithNavController()'],
                ['Logo', 'À définir — ajouter en format SVG dans res/drawable/ une fois fourni'],
                ['Dark mode', 'Non spécifié pour l\'instant — prévoir res/values-night/colors.xml'],
              ].map(([k,v])=>(
                <div key={k} style={{background:'rgba(255,255,255,0.5)', borderRadius:8, padding:'10px 12px'}}>
                  <div style={{fontWeight:600, marginBottom:3}}>{k}</div>
                  <div style={{fontSize:12, color:'#4A7A34', lineHeight:1.5}}>{v}</div>
                </div>
              ))}
            </div>
          </div>
        </section>

      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
